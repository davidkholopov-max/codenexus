version: '3.9'

services:
  # ─── PostgreSQL Database ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: codenexus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: codenexus
      POSTGRES_PASSWORD: codenexus_dev_password
      POSTGRES_DB: codenexus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codenexus"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (for sessions + job queue) ────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: codenexus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Code Execution Sandbox ───────────────────────────────────────
  sandbox:
    build:
      context: ..
      dockerfile: docker/sandbox/Dockerfile
    container_name: codenexus-sandbox
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis://redis:6379
      - MAX_CONCURRENT_EXECUTIONS=10
      - EXECUTION_TIMEOUT_MS=10000
      - DOCKER_NETWORK=codenexus-sandbox-net
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - sandbox-net

  # ─── Python Runner (isolated) ─────────────────────────────────────
  python-runner:
    build:
      context: ./sandbox/runners/python
    image: codenexus-runner-python:latest
    profiles: ["runners"]  # Only built, not started
    network_mode: none

  # ─── Node.js Runner (isolated) ────────────────────────────────────
  node-runner:
    build:
      context: ./sandbox/runners/node
    image: codenexus-runner-node:latest
    profiles: ["runners"]
    network_mode: none

  # ─── Go Runner (isolated) ────────────────────────────────────────
  go-runner:
    build:
      context: ./sandbox/runners/go
    image: codenexus-runner-go:latest
    profiles: ["runners"]
    network_mode: none

  # ─── Java Runner (isolated) ──────────────────────────────────────
  java-runner:
    build:
      context: ./sandbox/runners/java
    image: codenexus-runner-java:latest
    profiles: ["runners"]
    network_mode: none

  # ─── C++ Runner (isolated) ───────────────────────────────────────
  cpp-runner:
    build:
      context: ./sandbox/runners/cpp
    image: codenexus-runner-cpp:latest
    profiles: ["runners"]
    network_mode: none

  # ─── SQLite Runner (isolated) ────────────────────────────────────
  sqlite-runner:
    build:
      context: ./sandbox/runners/sqlite
    image: codenexus-runner-sqlite:latest
    profiles: ["runners"]
    network_mode: none

  # ─── Nginx Reverse Proxy ──────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: codenexus-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - sandbox

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: codenexus-net
  sandbox-net:
    name: codenexus-sandbox-net
    internal: true  # No internet access for code runners
